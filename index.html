<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { serif: ['Newsreader', 'Georgia', 'serif'], sans: ['Public Sans', 'system-ui', 'sans-serif'] },
  colors: { ink: '#172033', mute: '#5b6577', paper: '#eef2f5', line: '#d5dce4', brand: '#1f4e79', rust: '#b3412e' }
} } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  body { font-family: 'Public Sans', system-ui, sans-serif; background: #eef2f5; color: #172033; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- API helper ---------- */
let TOKEN = '';
try { TOKEN = localStorage.getItem('lib_token') || ''; } catch (e) {}

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}),
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(data.error || 'Something went wrong. Please try again.');
    error.status = res.status;
    throw error;
  }
  return data;
}

/* ---------- small helpers ---------- */
const SPINES = ['#1f4e79', '#8a3b2e', '#2f6b4f', '#6b4a8c', '#a8741a', '#2b6f7a', '#7a3552', '#4d5b2a'];
function spine(category) {
  let h = 0;
  for (const c of category || 'General') h = (h * 31 + c.charCodeAt(0)) % 997;
  return SPINES[h % SPINES.length];
}
const field = 'w-full border border-line rounded px-3 py-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-brand';
const primary = 'px-4 py-2 rounded bg-brand text-white text-sm font-medium hover:bg-[#173b5c] disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand';
const quiet = 'px-3 py-1.5 rounded border border-line bg-white text-sm hover:bg-paper focus:outline-none focus:ring-2 focus:ring-brand';

function dueText(loan) {
  if (loan.returned_on) return 'Returned on ' + loan.returned_on;
  if (loan.overdue) return 'Overdue by ' + loan.days_late + (loan.days_late === 1 ? ' day' : ' days');
  if (loan.days_left === 0) return 'Due today';
  return 'Due in ' + loan.days_left + (loan.days_left === 1 ? ' day' : ' days');
}

function Empty({ children }) {
  return html`<p className="text-mute text-sm py-8 text-center">${children}</p>`;
}

/* ---------- sign in ---------- */
function Login({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [form, setForm] = useState({ name: '', email: '', roll_no: '', password: '' });
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setForm(Object.assign({}, form, { [k]: e.target.value }));

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError('');
    try {
      const data = mode === 'login'
        ? await api('/auth/login', { method: 'POST', body: { email: form.email, password: form.password } })
        : await api('/auth/register', { method: 'POST', body: form });
      onAuth(data);
    } catch (err) { setError(err.message); }
    setBusy(false);
  }

  return html`<main className="min-h-screen grid md:grid-cols-2">
    <section className="bg-brand text-white p-10 md:p-16 flex flex-col justify-end min-h-[260px]">
      <div className="flex gap-1.5 mb-8" aria-hidden="true">
        ${SPINES.map((c, i) => html`<div key=${i} style=${{ background: c, height: 70 + ((i * 37) % 50), width: 22, borderRadius: 2, opacity: 0.95 }} />`)}
      </div>
      <h1 className="font-serif text-4xl md:text-5xl leading-tight">Smart Library</h1>
      <p className="mt-3 text-white/80 max-w-sm">Find books by describing what you want to learn, and get picks based on what you read.</p>
    </section>
    <section className="p-8 md:p-16 flex items-center">
      <form onSubmit=${submit} className="w-full max-w-sm space-y-4">
        <h2 className="font-serif text-2xl">${mode === 'login' ? 'Log in' : 'Create your account'}</h2>
        ${mode === 'register' && html`
          <div><label htmlFor="name" className="text-sm font-medium">Full name</label><input id="name" className=${field} value=${form.name} onChange=${set('name')} required /></div>
          <div><label htmlFor="roll" className="text-sm font-medium">Roll number</label><input id="roll" className=${field} value=${form.roll_no} onChange=${set('roll_no')} required /></div>`}
        <div>
          <label htmlFor="email" className="text-sm font-medium">${mode === 'login' ? 'Email or roll number' : 'Email'}</label>
          <input id="email" className=${field} value=${form.email} onChange=${set('email')} required />
        </div>
        <div>
          <label htmlFor="pw" className="text-sm font-medium">Password</label>
          <input id="pw" type="password" className=${field} value=${form.password} onChange=${set('password')} required minLength="6" />
        </div>
        ${error && html`<p role="alert" className="text-sm text-rust">${error}</p>`}
        <button className=${primary + ' w-full'} disabled=${busy}>${mode === 'login' ? 'Log in' : 'Create account'}</button>
        <p className="text-sm text-mute">
          ${mode === 'login' ? 'New student?' : 'Already registered?'}
          <button type="button" className="text-brand underline ml-1" onClick=${() => { setMode(mode === 'login' ? 'register' : 'login'); setError(''); }}>
            ${mode === 'login' ? 'Create an account' : 'Log in'}
          </button>
        </p>
      </form>
    </section>
  </main>`;
}

/* ---------- catalogue ---------- */
function BookCard({ b, onOpen, onBorrow, note }) {
  return html`<article className="bg-white border border-line rounded-md flex overflow-hidden">
    <div style=${{ background: spine(b.category), width: 10, flexShrink: 0 }} />
    <div className="p-4 flex-1 min-w-0 flex flex-col">
      <button onClick=${() => onOpen(b)} className="text-left font-serif text-lg leading-snug hover:underline focus:outline-none focus:ring-2 focus:ring-brand rounded">${b.title}</button>
      <div className="text-sm text-mute mt-0.5">${b.author}</div>
      <div className="text-xs text-mute mt-2">${b.category}${b.match != null ? ' - ' + b.match + '% match' : ''}</div>
      ${note && html`<div className="text-xs text-brand mt-1.5">${note}</div>`}
      <div className="mt-auto pt-3 flex items-center justify-between gap-2">
        <span className=${'text-sm ' + (b.available ? '' : 'text-rust')}>${b.available ? b.available + ' of ' + b.total + ' available' : 'All copies are out'}</span>
        <button className=${primary} disabled=${!b.available} onClick=${() => onBorrow(b)}>Borrow</button>
      </div>
    </div>
  </article>`;
}

function BookModal({ book, onClose, onBorrow, onOpen }) {
  const [detail, setDetail] = useState(null);
  useEffect(() => {
    setDetail(null);
    api('/books/' + book.id).then(setDetail).catch(() => {});
  }, [book.id]);
  const b = detail ? detail.book : book;
  return html`<div className="fixed inset-0 bg-ink/50 z-20 flex items-center justify-center p-4" onClick=${onClose}>
    <div role="dialog" aria-modal="true" aria-label=${b.title} className="bg-white rounded-md max-w-xl w-full max-h-[90vh] overflow-auto flex" onClick=${(e) => e.stopPropagation()}>
      <div style=${{ background: spine(b.category), width: 12, flexShrink: 0 }} />
      <div className="p-6 flex-1">
        <div className="flex justify-between gap-4">
          <h2 className="font-serif text-2xl leading-snug">${b.title}</h2>
          <button className=${quiet} onClick=${onClose}>Close</button>
        </div>
        <p className="text-mute mt-1">${b.author}</p>
        <p className="text-sm text-mute mt-1">${b.category}${b.isbn ? ' - ISBN ' + b.isbn : ''}</p>
        <p className="mt-4 text-[15px] leading-relaxed">${b.description || 'No description has been added for this book yet.'}</p>
        <div className="mt-5 flex items-center gap-4">
          <button className=${primary} disabled=${!b.available} onClick=${() => onBorrow(b)}>Borrow</button>
          <span className="text-sm">${b.available} of ${b.total} available</span>
        </div>
        ${detail && detail.similar.length > 0 && html`<div className="mt-6 border-t border-line pt-4">
          <h3 className="font-medium text-sm mb-2">Similar books</h3>
          <ul className="space-y-1.5">
            ${detail.similar.map((s) => html`<li key=${s.id}>
              <button className="text-left text-brand hover:underline text-sm" onClick=${() => onOpen(s)}>${s.title}</button>
              <span className="text-xs text-mute"> by ${s.author}, ${s.match}% match</span>
            </li>`)}
          </ul>
        </div>`}
      </div>
    </div>
  </div>`;
}

function Catalog({ notify }) {
  const [q, setQ] = useState('');
  const [mode, setMode] = useState('keyword');
  const [category, setCategory] = useState('');
  const [categories, setCategories] = useState([]);
  const [books, setBooks] = useState([]);
  const [open, setOpen] = useState(null);
  const [tick, setTick] = useState(0);

  useEffect(() => { api('/categories').then((d) => setCategories(d.categories)).catch(() => {}); }, []);
  useEffect(() => {
    const timer = setTimeout(() => {
      const url = mode === 'meaning' && q.trim()
        ? '/search?q=' + encodeURIComponent(q)
        : '/books?q=' + encodeURIComponent(q) + '&category=' + encodeURIComponent(category);
      api(url).then((d) => setBooks(d.books)).catch((e) => notify(e.message, 'error'));
    }, 250);
    return () => clearTimeout(timer);
  }, [q, mode, category, tick]);

  async function borrow(b) {
    try {
      const { loan } = await api('/borrow', { method: 'POST', body: { book_id: b.id } });
      notify('Borrowed "' + b.title + '". Return it by ' + loan.due_on + '.');
      setTick(tick + 1);
      setOpen(null);
    } catch (e) { notify(e.message, 'error'); }
  }

  return html`<div>
    <div className="flex flex-col md:flex-row gap-3">
      <div className="flex-1">
        <label htmlFor="q" className="sr-only">Search the catalogue</label>
        <input id="q" className=${field + ' !py-2.5'} value=${q} onChange=${(e) => setQ(e.target.value)}
          placeholder=${mode === 'meaning' ? 'Describe what you want to learn, e.g. an easy book to learn machine learning' : 'Search by title, author or subject'} />
      </div>
      <div className="flex rounded border border-line overflow-hidden bg-white text-sm" role="group" aria-label="Search type">
        ${[['keyword', 'Keyword'], ['meaning', 'Describe it']].map(([k, label]) => html`<button key=${k} onClick=${() => setMode(k)} aria-pressed=${mode === k}
          className=${'px-4 py-2 ' + (mode === k ? 'bg-brand text-white' : 'hover:bg-paper')}>${label}</button>`)}
      </div>
    </div>
    ${mode === 'keyword' && categories.length > 0 && html`<div className="flex flex-wrap gap-2 mt-3">
      ${['', ...categories].map((c) => html`<button key=${c || 'all'} onClick=${() => setCategory(c)} aria-pressed=${category === c}
        className=${'px-3 py-1 rounded-full text-sm border ' + (category === c ? 'bg-ink text-white border-ink' : 'bg-white border-line hover:bg-paper')}>${c || 'All'}</button>`)}
    </div>`}
    ${books.length === 0
      ? html`<${Empty}>${q ? 'No books matched. Try different words, or switch the search type.' : 'The catalogue is empty. Ask the librarian to add books.'}<//>`
      : html`<div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5">
          ${books.map((b) => html`<${BookCard} key=${b.id} b=${b} onOpen=${setOpen} onBorrow=${borrow} />`)}
        </div>`}
    ${open && html`<${BookModal} book=${open} onClose=${() => setOpen(null)} onBorrow=${borrow} onOpen=${setOpen} />`}
  </div>`;
}

/* ---------- recommendations ---------- */
function ForYou({ notify }) {
  const [data, setData] = useState(null);
  const [open, setOpen] = useState(null);
  const [tick, setTick] = useState(0);
  useEffect(() => { api('/recommendations').then(setData).catch((e) => notify(e.message, 'error')); }, [tick]);

  async function borrow(b) {
    try {
      const { loan } = await api('/borrow', { method: 'POST', body: { book_id: b.id } });
      notify('Borrowed "' + b.title + '". Return it by ' + loan.due_on + '.');
      setTick(tick + 1); setOpen(null);
    } catch (e) { notify(e.message, 'error'); }
  }
  if (!data) return html`<${Empty}>Loading your picks...<//>`;
  return html`<div>
    <p className="text-sm text-mute mb-4">${data.personalised
      ? 'Picked from the books you borrowed and opened. They get better as you read more.'
      : 'Borrow or open a few books and your picks will be tailored to you. Until then, here is what others read.'}</p>
    ${data.books.length === 0 ? html`<${Empty}>Nothing to suggest yet.<//>` : html`<div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
      ${data.books.map((b) => html`<${BookCard} key=${b.id} b=${b} note=${b.reason} onOpen=${setOpen} onBorrow=${borrow} />`)}
    </div>`}
    ${open && html`<${BookModal} book=${open} onClose=${() => setOpen(null)} onBorrow=${borrow} onOpen=${setOpen} />`}
  </div>`;
}

/* ---------- my books ---------- */
function LoanTable({ loans, onReturn, admin }) {
  return html`<div className="overflow-x-auto bg-white border border-line rounded-md">
    <table className="w-full text-sm">
      <thead className="text-left text-mute border-b border-line"><tr>
        <th className="p-3 font-medium">Book</th>${admin && html`<th className="p-3 font-medium">Student</th>`}
        <th className="p-3 font-medium">Status</th><th className="p-3 font-medium">Fine</th><th className="p-3"></th>
      </tr></thead>
      <tbody>${loans.map((l) => html`<tr key=${l.id} className="border-b border-line last:border-0">
        <td className="p-3"><div className="font-serif text-base">${l.title}</div><div className="text-mute text-xs">${l.author}</div></td>
        ${admin && html`<td className="p-3">${l.student}<div className="text-xs text-mute">${l.roll_no}</div></td>`}
        <td className=${'p-3 ' + (l.overdue ? 'text-rust font-medium' : '')}>${dueText(l)}</td>
        <td className="p-3">${l.fine ? 'Rs ' + l.fine : '-'}</td>
        <td className="p-3 text-right">${!l.returned_on && html`<button className=${quiet} onClick=${() => onReturn(l)}>Return</button>`}</td>
      </tr>`)}</tbody>
    </table>
  </div>`;
}

function MyBooks({ notify }) {
  const [loans, setLoans] = useState(null);
  const load = () => api('/my-loans').then((d) => setLoans(d.loans)).catch((e) => notify(e.message, 'error'));
  useEffect(() => { load(); }, []);
  async function giveBack(l) {
    try {
      const { loan } = await api('/return', { method: 'POST', body: { loan_id: l.id } });
      notify(loan.fine ? 'Returned. Late fine to pay: Rs ' + loan.fine + '.' : 'Returned. Thank you!');
      load();
    } catch (e) { notify(e.message, 'error'); }
  }
  if (!loans) return html`<${Empty}>Loading...<//>`;
  const active = loans.filter((l) => !l.returned_on);
  const past = loans.filter((l) => l.returned_on);
  const owed = active.reduce((s, l) => s + l.fine, 0);
  return html`<div className="space-y-8">
    <section>
      <h2 className="font-serif text-xl mb-1">Borrowed now</h2>
      <p className="text-sm text-mute mb-3">You can hold up to 3 books for 14 days. Late returns cost Rs 5 per day.${owed ? ' Fine so far: Rs ' + owed + '.' : ''}</p>
      ${active.length ? html`<${LoanTable} loans=${active} onReturn=${giveBack} />` : html`<${Empty}>You have no books issued. Browse the catalogue to borrow one.<//>`}
    </section>
    ${past.length > 0 && html`<section><h2 className="font-serif text-xl mb-3">Reading history</h2><${LoanTable} loans=${past} /></section>`}
  </div>`;
}

/* ---------- admin: overview ---------- */
function Overview({ notify }) {
  const [a, setA] = useState(null);
  const [demand, setDemand] = useState([]);
  useEffect(() => {
    api('/analytics').then(setA).catch((e) => notify(e.message, 'error'));
    api('/demand').then((d) => setDemand(d.forecast)).catch(() => {});
  }, []);
  if (!a) return html`<${Empty}>Loading...<//>`;
  const tiles = [['Titles', a.titles], ['Copies', a.copies], ['Students', a.students], ['Issued now', a.active_loans],
    ['Overdue', a.overdue], ['Fines collected', 'Rs ' + a.fines_collected], ['Fines pending', 'Rs ' + a.fines_pending]];
  const peak = Math.max(1, ...a.weekly.map((w) => w.count));
  return html`<div className="space-y-8">
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${tiles.map(([label, value]) => html`<div key=${label} className="bg-white border border-line rounded-md p-4">
        <div className="font-serif text-2xl">${value}</div><div className="text-sm text-mute">${label}</div></div>`)}
    </div>
    <div className="grid md:grid-cols-2 gap-6">
      <section className="bg-white border border-line rounded-md p-4">
        <h2 className="font-serif text-lg mb-4">Books issued per week</h2>
        <div className="flex items-end gap-2 h-36">
          ${a.weekly.map((w) => html`<div key=${w.label} className="flex-1 flex flex-col items-center justify-end h-full">
            <span className="text-xs mb-1">${w.count}</span>
            <div className="w-full bg-brand rounded-t" style=${{ height: (w.count / peak * 100) + '%', minHeight: w.count ? 4 : 1 }} />
            <span className="text-[11px] text-mute mt-1">${w.label}</span></div>`)}
        </div>
      </section>
      <section className="bg-white border border-line rounded-md p-4">
        <h2 className="font-serif text-lg mb-3">Most borrowed</h2>
        ${a.top_books.length ? html`<ol className="space-y-2 text-sm">${a.top_books.map((b, i) => html`<li key=${i} className="flex justify-between gap-3">
          <span>${b.title}</span><span className="text-mute whitespace-nowrap">${b.loans} ${b.loans === 1 ? 'loan' : 'loans'}</span></li>`)}</ol>`
          : html`<${Empty}>No loans yet.<//>`}
      </section>
    </div>
    <section className="bg-white border border-line rounded-md p-4">
      <h2 className="font-serif text-lg">Demand forecast for the next 30 days</h2>
      <p className="text-sm text-mute mb-3">Based on the last 8 weeks of issues, with recent weeks counting more.</p>
      ${demand.length ? html`<div className="overflow-x-auto"><table className="w-full text-sm">
        <thead className="text-left text-mute border-b border-line"><tr><th className="py-2 font-medium">Book</th><th className="font-medium">Issued (8 wks)</th><th className="font-medium">Expected next 30 days</th><th className="font-medium">Trend</th><th className="font-medium">Copies</th><th className="font-medium">Advice</th></tr></thead>
        <tbody>${demand.map((r) => html`<tr key=${r.book_id} className="border-b border-line last:border-0">
          <td className="py-2 pr-3">${r.title}</td><td>${r.issued_last_8_weeks}</td><td>${r.predicted_30_days}</td><td>${r.trend}</td><td>${r.copies}</td>
          <td className=${r.extra_copies ? 'text-rust font-medium' : 'text-mute'}>${r.extra_copies ? 'Add ' + r.extra_copies + (r.extra_copies === 1 ? ' copy' : ' copies') : 'Stock is enough'}</td></tr>`)}</tbody>
      </table></div>` : html`<${Empty}>The forecast appears once books have been issued.<//>`}
    </section>
  </div>`;
}

/* ---------- admin: books and students ---------- */
function CsvImport({ path, hint, onDone, notify }) {
  const [csv, setCsv] = useState('');
  function pick(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setCsv(String(reader.result));
    reader.readAsText(file);
  }
  async function run() {
    try {
      const d = await api(path, { method: 'POST', body: { csv } });
      notify('Imported ' + d.added + ', skipped ' + d.skipped + ' (duplicates or missing details).');
      setCsv(''); onDone();
    } catch (e) { notify(e.message, 'error'); }
  }
  return html`<div className="bg-white border border-line rounded-md p-4">
    <h3 className="font-medium mb-1">Import from a CSV file</h3>
    <p className="text-xs text-mute mb-2">Columns: ${hint}</p>
    <input type="file" accept=".csv,text/csv" onChange=${pick} className="text-sm" aria-label="Choose a CSV file" />
    ${csv && html`<div className="mt-3 flex items-center gap-3"><span className="text-sm text-mute">File loaded.</span><button className=${primary} onClick=${run}>Import now</button></div>`}
  </div>`;
}

function AdminBooks({ notify }) {
  const blank = { title: '', author: '', category: '', description: '', isbn: '', copies: 1 };
  const [form, setForm] = useState(blank);
  const [books, setBooks] = useState([]);
  const load = () => api('/books').then((d) => setBooks(d.books)).catch((e) => notify(e.message, 'error'));
  useEffect(() => { load(); }, []);
  const set = (k) => (e) => setForm(Object.assign({}, form, { [k]: e.target.value }));

  async function add(e) {
    e.preventDefault();
    try { await api('/books', { method: 'POST', body: form }); notify('Added "' + form.title + '".'); setForm(blank); load(); }
    catch (err) { notify(err.message, 'error'); }
  }
  async function remove(b) {
    if (!confirm('Delete "' + b.title + '" and its history?')) return;
    try { await api('/books/' + b.id, { method: 'DELETE' }); notify('Deleted.'); load(); } catch (err) { notify(err.message, 'error'); }
  }
  async function copies(b) {
    const value = prompt('Total copies of "' + b.title + '"', b.total);
    if (value === null) return;
    try { await api('/books/' + b.id, { method: 'PUT', body: Object.assign({}, b, { copies: value }) }); load(); }
    catch (err) { notify(err.message, 'error'); }
  }
  return html`<div className="space-y-6">
    <form onSubmit=${add} className="bg-white border border-line rounded-md p-4 grid md:grid-cols-3 gap-3">
      <h2 className="font-serif text-lg md:col-span-3">Add a book</h2>
      <div><label className="text-sm font-medium" htmlFor="bt">Title</label><input id="bt" className=${field} value=${form.title} onChange=${set('title')} required /></div>
      <div><label className="text-sm font-medium" htmlFor="ba">Author</label><input id="ba" className=${field} value=${form.author} onChange=${set('author')} required /></div>
      <div><label className="text-sm font-medium" htmlFor="bc">Category</label><input id="bc" className=${field} value=${form.category} onChange=${set('category')} placeholder="e.g. Machine Learning" /></div>
      <div><label className="text-sm font-medium" htmlFor="bi">ISBN</label><input id="bi" className=${field} value=${form.isbn} onChange=${set('isbn')} /></div>
      <div><label className="text-sm font-medium" htmlFor="bn">Copies</label><input id="bn" type="number" min="1" className=${field} value=${form.copies} onChange=${set('copies')} /></div>
      <div className="md:col-span-3"><label className="text-sm font-medium" htmlFor="bd">Description (the AI uses this to match books)</label><textarea id="bd" rows="2" className=${field} value=${form.description} onChange=${set('description')} /></div>
      <div><button className=${primary}>Add book</button></div>
    </form>
    <${CsvImport} path="/books/import" hint="title, author, category, description, isbn, copies" onDone=${load} notify=${notify} />
    <div className="overflow-x-auto bg-white border border-line rounded-md">
      <table className="w-full text-sm"><thead className="text-left text-mute border-b border-line"><tr><th className="p-3 font-medium">Title</th><th className="font-medium">Category</th><th className="font-medium">Available</th><th></th></tr></thead>
      <tbody>${books.map((b) => html`<tr key=${b.id} className="border-b border-line last:border-0">
        <td className="p-3"><div className="font-serif text-base">${b.title}</div><div className="text-xs text-mute">${b.author}</div></td>
        <td>${b.category}</td><td>${b.available} of ${b.total}</td>
        <td className="p-3 text-right whitespace-nowrap"><button className=${quiet} onClick=${() => copies(b)}>Change copies</button> <button className=${quiet + ' text-rust'} onClick=${() => remove(b)}>Delete</button></td>
      </tr>`)}</tbody></table>
      ${books.length === 0 && html`<${Empty}>No books yet. Add one above or import a CSV.<//>`}
    </div>
  </div>`;
}

function AdminStudents({ notify }) {
  const blank = { name: '', email: '', roll_no: '', password: '' };
  const [form, setForm] = useState(blank);
  const [students, setStudents] = useState([]);
  const load = () => api('/students').then((d) => setStudents(d.students)).catch((e) => notify(e.message, 'error'));
  useEffect(() => { load(); }, []);
  const set = (k) => (e) => setForm(Object.assign({}, form, { [k]: e.target.value }));
  async function add(e) {
    e.preventDefault();
    try { await api('/students', { method: 'POST', body: form }); notify('Added ' + form.name + '.'); setForm(blank); load(); }
    catch (err) { notify(err.message, 'error'); }
  }
  return html`<div className="space-y-6">
    <form onSubmit=${add} className="bg-white border border-line rounded-md p-4 grid md:grid-cols-4 gap-3 items-end">
      <h2 className="font-serif text-lg md:col-span-4">Add a student</h2>
      <div><label className="text-sm font-medium" htmlFor="sn">Full name</label><input id="sn" className=${field} value=${form.name} onChange=${set('name')} required /></div>
      <div><label className="text-sm font-medium" htmlFor="se">Email</label><input id="se" className=${field} value=${form.email} onChange=${set('email')} required /></div>
      <div><label className="text-sm font-medium" htmlFor="sr">Roll number</label><input id="sr" className=${field} value=${form.roll_no} onChange=${set('roll_no')} required /></div>
      <div><label className="text-sm font-medium" htmlFor="sp">Password (blank uses the roll number)</label><input id="sp" className=${field} value=${form.password} onChange=${set('password')} /></div>
      <div><button className=${primary}>Add student</button></div>
    </form>
    <${CsvImport} path="/students/import" hint="name, email, roll_no, password (optional)" onDone=${load} notify=${notify} />
    <div className="overflow-x-auto bg-white border border-line rounded-md">
      <table className="w-full text-sm"><thead className="text-left text-mute border-b border-line"><tr><th className="p-3 font-medium">Name</th><th className="font-medium">Roll number</th><th className="font-medium">Email</th><th className="font-medium">Books issued</th></tr></thead>
      <tbody>${students.map((s) => html`<tr key=${s.id} className="border-b border-line last:border-0"><td className="p-3">${s.name}</td><td>${s.roll_no}</td><td>${s.email}</td><td>${s.active_loans}</td></tr>`)}</tbody></table>
      ${students.length === 0 && html`<${Empty}>No students yet. Students can also register themselves.<//>`}
    </div>
  </div>`;
}

function IssueReturn({ notify }) {
  const [roll, setRoll] = useState('');
  const [bookId, setBookId] = useState('');
  const [books, setBooks] = useState([]);
  const [loans, setLoans] = useState([]);
  const load = () => {
    api('/books').then((d) => setBooks(d.books)).catch(() => {});
    api('/loans?active=1').then((d) => setLoans(d.loans)).catch((e) => notify(e.message, 'error'));
  };
  useEffect(() => { load(); }, []);
  async function issue(e) {
    e.preventDefault();
    try {
      const { loan } = await api('/borrow', { method: 'POST', body: { book_id: Number(bookId), roll_no: roll } });
      notify('Issued "' + loan.title + '" to ' + loan.student + '. Due ' + loan.due_on + '.');
      setRoll(''); setBookId(''); load();
    } catch (err) { notify(err.message, 'error'); }
  }
  async function giveBack(l) {
    try {
      const { loan } = await api('/return', { method: 'POST', body: { loan_id: l.id } });
      notify(loan.fine ? 'Returned. Collect a fine of Rs ' + loan.fine + ' from ' + l.student + '.' : 'Returned.');
      load();
    } catch (err) { notify(err.message, 'error'); }
  }
  return html`<div className="space-y-6">
    <form onSubmit=${issue} className="bg-white border border-line rounded-md p-4 grid md:grid-cols-3 gap-3 items-end">
      <h2 className="font-serif text-lg md:col-span-3">Issue a book</h2>
      <div><label className="text-sm font-medium" htmlFor="ir">Student roll number</label><input id="ir" className=${field} value=${roll} onChange=${(e) => setRoll(e.target.value)} required /></div>
      <div><label className="text-sm font-medium" htmlFor="ib">Book</label>
        <select id="ib" className=${field} value=${bookId} onChange=${(e) => setBookId(e.target.value)} required>
          <option value="">Choose a book</option>
          ${books.map((b) => html`<option key=${b.id} value=${b.id} disabled=${!b.available}>${b.title} (${b.available} available)</option>`)}
        </select></div>
      <div><button className=${primary}>Issue book</button></div>
    </form>
    <section>
      <h2 className="font-serif text-xl mb-3">Issued now</h2>
      ${loans.length ? html`<${LoanTable} loans=${loans} onReturn=${giveBack} admin=${true} />` : html`<${Empty}>No books are issued right now.<//>`}
    </section>
  </div>`;
}

/* ---------- app shell ---------- */
function App() {
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState('');
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  function notify(message, kind) {
    setToast({ message, kind });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4500);
  }
  function signIn(data) {
    TOKEN = data.token;
    try { localStorage.setItem('lib_token', TOKEN); } catch (e) {}
    setUser(data.user);
    setTab(data.user.role === 'admin' ? 'overview' : 'catalog');
  }
  function signOut() {
    TOKEN = '';
    try { localStorage.removeItem('lib_token'); } catch (e) {}
    setUser(null);
  }
  useEffect(() => {
    if (!TOKEN) { setReady(true); return; }
    api('/auth/me').then((d) => { setUser(d.user); setTab(d.user.role === 'admin' ? 'overview' : 'catalog'); })
      .catch(() => { TOKEN = ''; }).finally(() => setReady(true));
  }, []);

  if (!ready) return null;
  if (!user) return html`<${Login} onAuth=${signIn} />`;

  const tabs = user.role === 'admin'
    ? [['overview', 'Overview'], ['books', 'Books'], ['students', 'Students'], ['issue', 'Issue and return']]
    : [['catalog', 'Catalogue'], ['foryou', 'For you'], ['mine', 'My books']];
  const views = { overview: Overview, books: AdminBooks, students: AdminStudents, issue: IssueReturn, catalog: Catalog, foryou: ForYou, mine: MyBooks };
  const View = views[tab];

  return html`<div>
    <header className="bg-white border-b border-line">
      <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-8 gap-y-2">
        <span className="font-serif text-xl">Smart Library</span>
        <nav className="flex gap-1 flex-1 flex-wrap" aria-label="Main">
          ${tabs.map(([k, label]) => html`<button key=${k} onClick=${() => setTab(k)} aria-current=${tab === k ? 'page' : undefined}
            className=${'px-3 py-1.5 rounded text-sm ' + (tab === k ? 'bg-brand text-white' : 'hover:bg-paper')}>${label}</button>`)}
        </nav>
        <div className="text-sm text-mute flex items-center gap-3">${user.name}<button className=${quiet} onClick=${signOut}>Log out</button></div>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-6"><${View} key=${tab} notify=${notify} /></main>
    ${toast && html`<div role="status" className=${'fixed bottom-4 left-1/2 -translate-x-1/2 z-30 px-4 py-2.5 rounded shadow-lg text-sm text-white max-w-[90vw] ' + (toast.kind === 'error' ? 'bg-rust' : 'bg-ink')}>${toast.message}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
